name: Test Djinn

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  cli:
    name: "Command line smoke tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Build
        run: |
          make djinn
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Make a coordinate-sorted copy of the test BAM
        run: samtools sort -o sorted.bam test/test.bam

      # ── fq ──
      - name: fq convert
        if: success() || failure()
        run: |
          for fmt in stlfr tellseq 10x; do
            djinn fq convert $fmt result.$fmt test/test.R1.fq.gz test/test.R2.fq.gz &&\
            echo "============= $fmt R1 =============" && zcat result.$fmt.R1.fq.gz &&\
            echo "============= $fmt R2 =============" && zcat result.$fmt.R2.fq.gz
          done
      - name: fq ncbi
        if: success() || failure()
        run: djinn fq ncbi test/test.R1.fq.gz test/test.R2.fq.gz | samtools view
      - name: fq sample
        if: success() || failure()
        run: djinn fq sample -d 2 sampled test/test.R1.fq.gz test/test.R2.fq.gz && zcat sampled.R1.fq.gz
      - name: fq extract
        if: success() || failure()
        run: djinn fq extract test/test.R1.fq.gz test/test.R2.fq.gz
      - name: fq count
        if: success() || failure()
        run: djinn fq count test/test.R1.fq.gz test/test.R2.fq.gz
      - name: fq sort
        if: success() || failure()
        run: djinn fq sort sorted test/test.R1.fq.gz test/test.R2.fq.gz && zcat sorted.R1.fq.gz
      - name: fq rm-invalid
        if: success() || failure()
        run: djinn fq rm-invalid valid test/test.R1.fq.gz test/test.R2.fq.gz && zcat valid.R1.fq.gz
      - name: fq rm-unlinked
        if: success() || failure()
        run: djinn fq rm-unlinked linked test/test.R1.fq.gz test/test.R2.fq.gz && zcat linked.R1.fq.gz
      - name: fq stats
        if: success() || failure()
        run: djinn fq stats test/test.R1.fq.gz

      # ── sam ──
      - name: sam convert
        if: success() || failure()
        run: djinn sam convert -m convert.map stlfr test/test.bam | samtools view
      - name: sam ncbi
        if: success() || failure()
        run: |
          djinn sam ncbi sam_ncbi test/test.bam &&\
          echo "============= R1 =============" && zcat sam_ncbi.R1.fq.gz &&\
          echo "============= R2 =============" && zcat sam_ncbi.R2.fq.gz
      - name: sam sample
        if: success() || failure()
        run: djinn sam sample -d 2 test/test.bam | samtools view
      - name: sam extract
        if: success() || failure()
        run: djinn sam extract test/test.bam
      - name: sam count
        if: success() || failure()
        run: djinn sam count test/test.bam
      - name: sam sort
        if: success() || failure()
        run: djinn sam sort test/test.bam | samtools view
      - name: sam rm-invalid
        if: success() || failure()
        run: djinn sam rm-invalid test/test.bam | samtools view
      - name: sam rm-unlinked
        if: success() || failure()
        run: djinn sam rm-unlinked test/test.bam | samtools view
      - name: sam concat
        if: success() || failure()
        run: djinn sam concat test/test.bam test/test.bam | samtools view
      - name: sam deconvolve
        if: success() || failure()
        run: djinn sam deconvolve -d 50000 sorted.bam | samtools view
      - name: sam stats
        if: success() || failure()
        run: |
          djinn sam stats test/s1.sam &&\
          djinn sam deconvolve -d 50000 sorted.bam 2>/dev/null | samtools sort | djinn sam stats -
