name: Upload Release Tarball
on:
  push:
    tags:
    - '*' # Push events of any tag created

jobs:
  build_tarball:
    name: Upload Release Tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create versioned artifact
        run: |
          mkdir artifacts
          tar --exclude="test" --exclude="docs" --exclude="bin" --exclude="artifacts" --exclude=".git*" -zcvf artifacts/djinn.${{ github.ref_name }}.tar.gz .
      - name: Create Release with Assets
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/djinn.${{ github.ref_name }}.tar.gz
          body_path: CHANGELOG.md
          generate_release_notes: true
