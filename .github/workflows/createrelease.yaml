name: Create Versioned Release

on:
  push:
    tags:
    - '*' # Push events of any tag created

jobs:
  build_release:
    name: Upload Release Tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build project tarball
        run: |
          mkdir artifacts
          tar -zcvf --exclude artifacts --exclude test --exclude docs --exclude .git* artifacts/djinn.${{ github.ref_name }}.tar.gz .
      - name: Create Release with Assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/djinn.${{ github.ref_name }}.tar.gz
          body_path: CHANGELOG.md
          generate_release_notes: true
